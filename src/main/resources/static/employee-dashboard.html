
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard</title>
    <link rel="stylesheet" href="employee-dashboard.css">
</head>
<body>

<div class="app-container">

    <aside class="sidebar">
        <h2>EMS</h2>
        <p class="sidebar-subtitle">Employee Portal</p>

        <nav>
            <a href="#" class="nav-link active" data-section="profile">My Profile</a>
            <a href="#" class="nav-link" data-section="apply-leave">Apply Leave</a>
            <a href="#" class="nav-link" data-section="my-leaves">My Leave Requests</a>
        </nav>

        <button id="logoutBtn" class="logout-btn">Logout</button>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <div>
                <h2>Employee Dashboard</h2>
                <p>Welcome to your employee portal</p>
            </div>
            <span id="employeeEmail">Employee</span>
        </header>

        <!-- Profile Section -->
        <section id="profile" class="page-section active">
            <h2>My Profile</h2>

            <div class="profile-card">
                <div class="profile-avatar" id="profileInitial">E</div>

                <div class="profile-details">
                    <h3 id="profileName">Loading...</h3>
                    <p id="profileEmail"></p>
                </div>
            </div>

            <div class="profile-grid">
                <div class="info-card">
                    <span>Employee ID</span>
                    <h3 id="employeeId">-</h3>
                </div>

                <div class="info-card">
                    <span>Salary</span>
                    <h3 id="employeeSalary">-</h3>
                </div>

                <div class="info-card">
                    <span>Department</span>
                    <h3 id="employeeDepartment">-</h3>
                </div>
            </div>
        </section>

        <!-- Apply Leave Section -->
        <section id="apply-leave" class="page-section">
            <h2>Apply for Leave</h2>

            <div class="form-card">
                <form id="leaveForm">

                    <div class="form-group">
                        <label for="startDate">Start Date</label>
                        <input type="date" id="startDate" required>
                    </div>

                    <div class="form-group">
                        <label for="endDate">End Date</label>
                        <input type="date" id="endDate" required>
                    </div>

                    <div class="form-group">
                        <label for="leaveReason">Reason</label>
                        <textarea id="leaveReason"
                                  placeholder="Enter your reason"
                                  required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">
                        Submit Leave Request
                    </button>

                </form>
            </div>
        </section>

        <!-- My Leave Requests Section -->
        <section id="my-leaves" class="page-section">
            <h2>My Leave Requests</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Reason</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="myLeaveTableBody">
                        <tr>
                            <td colspan="5">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>
</div>

<script src="employee-dashboard.js"></script>
</body>
</html>
